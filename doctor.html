<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医生复核 · 小北健康</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="doctor-page">
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="xiaobei-logo.png" alt="小北健康" class="logo-img">
                <span>医生复核工作台</span>
            </a>
            <div class="nav-auth">
                <span id="doctorGreeting" class="nav-user-greeting" style="display:none"></span>
                <button type="button" class="btn-nav btn-nav-logout" id="doctorLogoutBtn" style="display:none">退出登录</button>
                <a href="index.html" class="btn-nav">返回用户端</a>
            </div>
        </div>
    </nav>

    <!-- 登录 -->
    <section id="doctorLoginSection" class="doctor-login-section">
        <div class="container">
            <div class="doctor-login-card">
                <h2>医生登录</h2>
                <p class="doctor-login-desc">请使用医生账号登录复核工作台</p>
                <form id="doctorLoginForm">
                    <div class="form-group">
                        <label for="doctorUsername">账号</label>
                        <input type="text" id="doctorUsername" value="doctor" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="doctorPassword">密码</label>
                        <input type="password" id="doctorPassword" required autocomplete="current-password">
                    </div>
                    <p id="doctorLoginError" class="form-error" style="display:none"></p>
                    <button type="submit" class="btn-primary btn-block">登录</button>
                </form>
            </div>
        </div>
    </section>

    <!-- 工作台 -->
    <section id="doctorWorkSection" class="doctor-work-section" style="display:none">
        <div class="container">
            <div class="doctor-tabs">
                <button type="button" class="doctor-tab active" data-tab="pending">待复核</button>
                <button type="button" class="doctor-tab" data-tab="reviewed">已复核（近30天）</button>
            </div>
            <div class="doctor-toolbar">
                <h2 id="listTitle">待复核队列 <span id="pendingCount" class="pending-badge">0</span></h2>
                <div class="doctor-filters" id="pendingFilters">
                    <select id="filterDays">
                        <option value="1">今日</option>
                        <option value="7" selected>近 7 日</option>
                        <option value="0">全部</option>
                    </select>
                    <button type="button" class="btn-secondary btn-sm" id="refreshListBtn">刷新</button>
                </div>
                <div class="doctor-filters" id="reviewedFilters" style="display:none">
                    <span class="filter-hint">显示过去 30 天内已复核病例</span>
                    <button type="button" class="btn-secondary btn-sm" id="refreshReviewedBtn">刷新</button>
                </div>
                <button type="button" class="btn-nav btn-nav-logout doctor-toolbar-logout" id="doctorLogoutToolbarBtn" style="display:none">退出登录</button>
            </div>
            <div id="reviewList" class="review-list"></div>
            <p id="reviewListEmpty" class="my-reports-empty" style="display:none">暂无待复核病例</p>
        </div>
    </section>

    <!-- 复核详情弹窗（待复核） -->
    <div id="reviewModal" class="modal-overlay" style="display:none">
        <div class="modal-card modal-card-wide">
            <button type="button" class="modal-close" id="reviewModalClose">&times;</button>
            <h3>病例复核</h3>
            <div class="review-detail-grid">
                <div class="review-image-panel">
                    <img id="reviewImage" alt="病例原图">
                    <div id="reviewAiInfo" class="review-ai-info"></div>
                </div>
                <div class="review-action-panel">
                    <p class="review-meta" id="reviewMeta"></p>
                    <div class="review-actions">
                        <button type="button" class="btn-primary" id="confirmBtn">确认 AI 判定正确</button>
                        <div class="review-correct-box">
                            <h4>或：判定错误并校正</h4>
                            <div class="form-group">
                                <label for="correctLabel">疾病标签</label>
                                <select id="correctLabel">
                                    <option value="非乳牙滞留">非乳牙滞留</option>
                                    <option value="乳牙滞留">乳牙滞留</option>
                                    <option value="龋病">龋病</option>
                                    <option value="牙周炎">牙周炎</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="correctNote">校正说明（必填）</label>
                                <textarea id="correctNote" rows="3" placeholder="请说明为何校正"></textarea>
                            </div>
                            <button type="button" class="btn-secondary" id="correctBtn">生成校正报告</button>
                        </div>
                    </div>
                    <p id="reviewActionError" class="form-error" style="display:none"></p>
                    <p id="reviewActionSuccess" class="form-success" style="display:none"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- 已复核详情弹窗（只读） -->
    <div id="reviewedModal" class="modal-overlay" style="display:none">
        <div class="modal-card modal-card-wide">
            <button type="button" class="modal-close" id="reviewedModalClose">&times;</button>
            <h3>已复核详情</h3>
            <div class="review-detail-grid">
                <div class="review-image-panel">
                    <img id="reviewedImage" alt="病例原图">
                </div>
                <div class="review-action-panel">
                    <div id="reviewedDetailContent" class="reviewed-detail-content"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="api-client.js?v=2"></script>
    <script src="doctor.js?v=3"></script>
</body>
</html>
